name: Build Dr Patil Digital OPD V25 - PDF Generation Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Validate the exact V25 source
        shell: bash
        run: |
          set -euo pipefail
          test -s DrPatil_Digital_OPD_V25_V22PlusBackupOnly.html
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('DrPatil_Digital_OPD_V25_V22PlusBackupOnly.html')
          s=p.read_text(encoding='utf-8')
          required=['id="print"','id="share"','id="printFollowup"','id="printArea"','window.print()','data-print-fu','data-direct-preview','data-preop-preview']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('V25 source validation failed: '+', '.join(missing))
          print('V25 bytes:',p.stat().st_size,'SHA-256:',hashlib.sha256(p.read_bytes()).hexdigest())
          print('All New Consultation, Follow-up, Patient Records and Pre-op print routes verified.')
          PY

      - name: Prepare V25 and install local PDF generator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www
          cp DrPatil_Digital_OPD_V25_V22PlusBackupOnly.html www/index.html
          cat > package.json <<'JSON'
          {"name":"dr-patil-digital-opd","version":"1.0.0","private":true}
          JSON
          npm install --no-audit --no-fund @capacitor/core@6.1.2 @capacitor/android@6.1.2
          npm install --no-audit --no-fund --save-dev @capacitor/cli@6.1.2
          npm install --no-audit --no-fund html2pdf.js@0.10.3
          test -s node_modules/html2pdf.js/dist/html2pdf.bundle.min.js
          cp node_modules/html2pdf.js/dist/html2pdf.bundle.min.js www/html2pdf.bundle.min.js
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.drpatil.digitalopd","appName":"Dr Patil Digital OPD","webDir":"www"}
          JSON
          npx cap add android
          npx cap sync android

      - name: Configure Android PDF FileProvider
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths><cache-path name="shared_pdfs" path="shared-pdfs/" /></paths>
          XML
          python3 - <<'PY'
          from pathlib import Path
          m=Path('android/app/src/main/AndroidManifest.xml')
          s=m.read_text(encoding='utf-8')
          if 'androidx.core.content.FileProvider' not in s:
            provider='''
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" />
                  </provider>
            '''
            if '</application>' not in s: raise SystemExit('AndroidManifest application tag missing')
            m.write_text(s.replace('</application>',provider+'\n</application>',1),encoding='utf-8')
          g=Path('android/app/build.gradle')
          s=g.read_text(encoding='utf-8')
          if 'androidx.core:core:' not in s:
            if 'dependencies {' not in s: raise SystemExit('Gradle dependencies block missing')
            g.write_text(s.replace('dependencies {',"dependencies {\n    implementation 'androidx.core:core:1.13.1'",1),encoding='utf-8')
          assert 'androidx.core.content.FileProvider' in m.read_text(encoding='utf-8')
          assert 'shared_pdfs' in Path('android/app/src/main/res/xml/file_paths.xml').read_text()
          print('FileProvider configuration verified.')
          PY

      - name: Add native Android PDF creation and sharing bridge
        shell: bash
        run: |
          set -euo pipefail
          D=android/app/src/main/java/com/drpatil/digitalopd
          mkdir -p "$D"
          cat > "$D/MainActivity.java" <<'JAVA'
          package com.drpatil.digitalopd;
          import android.content.ClipData;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Toast;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.BridgeActivity;
          import org.json.JSONObject;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;

          public class MainActivity extends BridgeActivity {
              private final Handler handler = new Handler(Looper.getMainLooper());
              private boolean installed = false;
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  handler.postDelayed(() -> installBridge(0), 300);
              }
              private void installBridge(int attempt) {
                  if (installed) return;
                  WebView view = bridge == null ? null : bridge.getWebView();
                  if (view == null) {
                      if (attempt < 80) handler.postDelayed(() -> installBridge(attempt + 1), 250);
                      else Toast.makeText(this,"Android PDF bridge failed to initialise.",Toast.LENGTH_LONG).show();
                      return;
                  }
                  view.addJavascriptInterface(new NativePdfBridge(this,view),"AndroidPrint");
                  installed = true;
                  view.postDelayed(view::reload,500);
              }
              public static final class NativePdfBridge {
                  private final MainActivity activity;
                  private final WebView webView;
                  private final Handler main = new Handler(Looper.getMainLooper());
                  NativePdfBridge(MainActivity a,WebView w){activity=a;webView=w;}
                  @JavascriptInterface public String ping(){return "DR_PATIL_PDF_BRIDGE_READY_V2";}
                  @JavascriptInterface public void print(){main.post(()->{
                      try {
                          PrintManager pm=(PrintManager)activity.getSystemService(Context.PRINT_SERVICE);
                          if(pm==null)throw new IllegalStateException("Android Print service unavailable");
                          String job="Dr Patil Digital OPD";
                          PrintAttributes attrs=new PrintAttributes.Builder()
                              .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                              .setResolution(new PrintAttributes.Resolution("opd300","OPD 300 DPI",300,300))
                              .setMinMargins(PrintAttributes.Margins.NO_MARGINS).build();
                          pm.print(job,webView.createPrintDocumentAdapter(job),attrs);
                          notifyPage("Android print dialog opened.",false);
                      } catch(Exception e){fail("Print dialog failed: "+err(e));}
                  });}
                  @JavascriptInterface public void sharePdf(String encoded,String patient){main.post(()->saveAndShare(encoded,patient));}
                  private void saveAndShare(String encoded,String patient){
                      File file=null;
                      try {
                          if(encoded==null||encoded.length()<1000)throw new IllegalArgumentException("PDF data is empty");
                          byte[] data=Base64.decode(encoded,Base64.DEFAULT);
                          if(data.length<500||data[0]!='%'||data[1]!='P'||data[2]!='D'||data[3]!='F')throw new IllegalArgumentException("Generated data is not a valid PDF");
                          File dir=new File(activity.getCacheDir(),"shared-pdfs");
                          if(!dir.exists()&&!dir.mkdirs())throw new IOException("Cannot create PDF cache folder");
                          String safe=(patient==null||patient.trim().isEmpty())?"Patient":patient.trim().replaceAll("[^a-zA-Z0-9._-]","_");
                          if(safe.length()>50)safe=safe.substring(0,50);
                          file=new File(dir,"DrPatil_"+safe+"_"+System.currentTimeMillis()+".pdf");
                          try(FileOutputStream out=new FileOutputStream(file)){out.write(data);out.flush();out.getFD().sync();}
                          if(!file.isFile()||file.length()!=data.length)throw new IOException("PDF was not completely written");
                          Uri uri=FileProvider.getUriForFile(activity,activity.getPackageName()+".fileprovider",file);
                          Intent send=new Intent(Intent.ACTION_SEND).setType("application/pdf");
                          send.putExtra(Intent.EXTRA_STREAM,uri);
                          send.setClipData(ClipData.newUri(activity.getContentResolver(),file.getName(),uri));
                          send.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          Intent chooser=Intent.createChooser(send,"Share patient PDF");
                          chooser.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          activity.startActivity(chooser);
                          notifyPage("PDF file created. Choose WhatsApp, WhatsApp Business or Save to Files.",false);
                      } catch(Exception e){if(file!=null&&file.exists())file.delete();fail("PDF creation/sharing failed: "+err(e));}
                  }
                  private String err(Exception e){return e.getClass().getSimpleName()+": "+String.valueOf(e.getMessage());}
                  private void fail(String msg){notifyPage(msg,true);Toast.makeText(activity,msg,Toast.LENGTH_LONG).show();}
                  private void notifyPage(String msg,boolean error){String q=JSONObject.quote(msg);webView.post(()->webView.evaluateJavascript("if(window.__drPatilPdfStatus){window.__drPatilPdfStatus("+q+","+error+");}",null));}
              }
          }
          JAVA

      - name: Connect all V25 digital PDF buttons to real PDF generation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('www/index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="dr-patil-pdf-generator-v2"' in s: raise SystemExit('Refusing duplicate PDF bridge injection')
          tag='<script src="html2pdf.bundle.min.js"></script>\n'
          if '</head>' not in s: raise SystemExit('V25 head closing tag missing')
          s=s.replace('</head>',tag+'</head>',1)
          bridge=r'''<script id="dr-patil-pdf-generator-v2">
          (function(){
            "use strict";
            var state="checking",badge=null,attempts=0,timer=null,busy=false;
            function show(message,isError){
              try{
                if(!document.body)return;
                if(!badge){badge=document.createElement('div');badge.id='dr-patil-pdf-status';badge.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:2147483647;padding:10px 12px;border-radius:9px;color:#fff;font:13px/1.4 system-ui,sans-serif;box-shadow:0 2px 12px #0005;display:none;text-align:center';document.body.appendChild(badge);}
                badge.textContent=message;badge.style.background=isError?'#9b1c1c':'#245b42';badge.style.display='block';
              }catch(e){}
            }
            window.__drPatilPdfStatus=show;
            // Diagnostic checkpoint 1: this banner must appear even if AndroidPrint is absent.
            function diagnostics(){
              var html2pdfReady=typeof window.html2pdf==='function';
              var androidObject=!!window.AndroidPrint;
              var pingReady=false;
              try{pingReady=!!(androidObject&&typeof window.AndroidPrint.ping==='function'&&window.AndroidPrint.ping()==='DR_PATIL_PDF_BRIDGE_READY_V2');}catch(e){}
              window.__drPatilPdfDiagnostics={javascriptLoaded:true,html2pdfLoaded:html2pdfReady,androidObjectPresent:androidObject,androidPingReady:pingReady,checkedAt:new Date().toISOString()};
              return window.__drPatilPdfDiagnostics;
            }
            show('PDF diagnostic 1/3: JavaScript loaded. Checking PDF library and Android service…',false);
            function connect(){
              try{
                if(window.AndroidPrint&&typeof window.AndroidPrint.ping==='function'&&window.AndroidPrint.ping()==='DR_PATIL_PDF_BRIDGE_READY_V2'&&typeof window.AndroidPrint.print==='function'&&typeof window.AndroidPrint.sharePdf==='function'&&typeof window.html2pdf==='function'){
                  state='connected';window.__drPatilPdfBridgeState=state;
                  window.print=function(){
                    if(busy){show('PDF is being created. Please wait.',false);return;}
                    if(state!=='connected'){show('Android PDF service is not connected. Close and reopen the app.',true);return;}
                    var area=document.getElementById('printArea');
                    var page=area&&area.querySelector('.letter-page');
                    if(!page){show('Patient document was not found in the print area.',true);return;}
                    if((window._opdPrintMode||'digital')==='physical'){
                      show('Opening print dialog for pre-printed letterhead…',false);
                      try{window.AndroidPrint.print();}catch(e){show('Physical printing failed: '+String(e),true);}finally{window._opdPrintMode='digital';}return;
                    }
                    busy=true;show('Creating patient PDF…',false);
                    var oldStyle=area.getAttribute('style');
                    var css=document.createElement('style');css.id='dr-patil-pdf-layout-v2';
                    css.textContent=`
                      #printArea{display:block!important;position:fixed!important;left:0!important;top:0!important;z-index:2147483000!important;width:210mm!important;margin:0!important;padding:0!important;background:#fff!important;opacity:.01!important;pointer-events:none!important}
                      #printArea .letter-page{position:relative!important;display:block!important;box-sizing:border-box!important;width:210mm!important;height:297mm!important;min-height:297mm!important;margin:0!important;padding:0!important;overflow:hidden!important;background:#fff!important;color:#17264c!important}
                      #printArea .letter-bg{position:absolute!important;inset:0!important;display:block!important;width:210mm!important;height:297mm!important;object-fit:fill!important;z-index:0!important}
                      #printArea .letter-patient{position:absolute!important;left:0!important;top:0!important;z-index:2!important;color:#17264c!important;font:8.4pt Arial,sans-serif!important}
                      #printArea .letter-patient .v{position:absolute!important;white-space:nowrap!important;overflow:hidden!important}
                      #printArea .letter-patient .name{left:32mm!important;top:57.4mm!important;width:91mm!important;font-family:'Instrument Serif',serif!important;font-style:italic!important;font-size:11pt!important}
                      #printArea .letter-patient .age{left:152mm!important;top:57.4mm!important;width:42mm!important;font-family:'Instrument Serif',serif!important;font-style:italic!important;font-size:11pt!important}
                      #printArea .letter-patient .ref{left:25.5mm!important;top:68.7mm!important;width:96mm!important}
                      #printArea .letter-patient .date{left:152mm!important;top:67.7mm!important;width:42mm!important}
                      #printArea .letter-patient .mobile{left:38mm!important;top:77.3mm!important;width:88mm!important}
                      #printArea .letter-clinical{position:absolute!important;z-index:2!important;left:55mm!important;top:95mm!important;width:141mm!important;height:137mm!important;overflow:hidden!important;color:#172033!important;font:8.8pt/1.24 Arial,sans-serif!important}
                      #printArea .letter-clinical h3{font:bold 8.7pt/1.15 Arial,sans-serif!important;text-decoration:underline!important;margin:1.8mm 0 1.1mm!important;color:#172033!important}
                      #printArea .letter-clinical p{font:8.4pt/1.18 Arial,sans-serif!important;white-space:pre-wrap!important;margin:0 0 .8mm!important}
                      #printArea .letter-clinical table{width:100%!important;border-collapse:collapse!important;table-layout:fixed!important;font:7.2pt/1.12 Arial,sans-serif!important}
                      #printArea .letter-clinical td,#printArea .letter-clinical th{border:0!important;padding:0 1mm .7mm 0!important;text-align:left!important;overflow-wrap:anywhere!important}
                      #printArea .letter-clinical .foot,#printArea .letter-clinical .doctor-head,#printArea .letter-clinical hr{display:none!important}
                      #printArea .letter-clinical .clinical-grid{display:grid!important;grid-template-columns:minmax(0,.82fr) minmax(0,1fr)!important;column-gap:2mm!important;row-gap:0!important;margin:0 0 1mm!important}
                      #printArea .letter-clinical .clinical-grid p{min-width:0!important;overflow-wrap:anywhere!important;margin:0 0 .65mm!important;font:8.2pt/1.16 Arial,sans-serif!important}
                      #printArea .letter-signature{position:absolute!important;z-index:2!important;left:55mm!important;top:234mm!important;width:141mm!important;text-align:right!important;color:#172033!important;font:8pt Arial,sans-serif!important}
                    `;
                    async function run(){
                      try{
                        document.head.appendChild(css);area.style.display='block';area.style.position='fixed';area.style.left='0';area.style.top='0';area.style.zIndex='2147483000';area.style.width='210mm';area.style.margin='0';area.style.padding='0';area.style.background='#fff';area.style.opacity='.01';area.style.pointerEvents='none';
                        await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
                        if(document.fonts&&document.fonts.ready)await document.fonts.ready;
                        var bg=page.querySelector('.letter-bg');
                        if(bg&&!bg.complete)await new Promise((resolve,reject)=>{bg.onload=resolve;bg.onerror=()=>reject(new Error('Letterhead image did not load'));});
                        if(bg&&bg.decode)await bg.decode();
                        var clinical=page.querySelector('.letter-clinical');if(!clinical)throw new Error('Clinical note area is missing');
                        var fs=8.8;while(clinical.scrollHeight>clinical.clientHeight+1&&fs>7){fs=Math.max(7,fs-.2);clinical.style.fontSize=fs+'pt';clinical.querySelectorAll('p,h3').forEach(n=>n.style.fontSize=(fs+(n.tagName==='H3'?.1:0))+'pt');}
                        if(clinical.scrollHeight>clinical.clientHeight+2)throw new Error('Note is too long for the letterhead writing area');
                        var result=await window.html2pdf().set({margin:0,image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#fff',logging:false,scrollX:0,scrollY:0,windowWidth:794,windowHeight:1123,onclone:function(doc){var a=doc.getElementById('printArea');if(a){a.style.opacity='1';a.style.position='static';a.style.left='auto';a.style.top='auto';a.style.zIndex='auto';}}},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(page).outputPdf('datauristring');
                        var comma=result.indexOf(',');if(comma<0)throw new Error('PDF generator returned invalid data');
                        var base64=result.substring(comma+1);if(!base64||base64.length<1000)throw new Error('Generated PDF is empty');
                        var nameNode=page.querySelector('.letter-patient .name');var patient=nameNode?nameNode.textContent.trim():'Patient';
                        show('PDF generated. Opening share options…',false);window.AndroidPrint.sharePdf(base64,patient||'Patient');
                      }catch(e){show('PDF creation failed: '+(e&&e.message?e.message:String(e)),true);alert('Could not create patient PDF: '+(e&&e.message?e.message:String(e)));}
                      finally{if(oldStyle===null)area.removeAttribute('style');else area.setAttribute('style',oldStyle);if(css.parentNode)css.parentNode.removeChild(css);busy=false;}
                    }
                    run();
                  };
                  show('PDF diagnostic 3/3: JavaScript, PDF library and Android bridge connected.',false);return true;
                }
              }catch(e){state='error';window.__drPatilPdfBridgeState=state;show('PDF bridge error: '+String(e),true);}
              return false;
            }
            window.__drPatilPdfBridgeState=state;
            window.print=function(){show('Android PDF service is not connected. Close and reopen the app.',true);alert('Android PDF service is not connected. Please close and reopen the OPD app.');};
            function start(){
              var d=diagnostics();
              if(!d.html2pdfLoaded)show('PDF diagnostic 1/3: JavaScript loaded, but html2pdf library is MISSING.',true);
              else if(!d.androidObjectPresent)show('PDF diagnostic 2/3: JavaScript and PDF library loaded; Android bridge is NOT PRESENT.',true);
              else if(!d.androidPingReady)show('PDF diagnostic 2/3: Android bridge object exists, but its ping check FAILED.',true);
              else show('PDF diagnostic: JavaScript, PDF library and Android ping detected. Checking methods…',false);
              if(connect()||timer)return;
              timer=setInterval(function(){attempts++;var d=diagnostics();
                if(connect()){clearInterval(timer);timer=null;}
                else if(attempts>=100){clearInterval(timer);timer=null;state='timeout';window.__drPatilPdfBridgeState=state;
                  if(!d.html2pdfLoaded)show('PDF diagnostic FAILED: html2pdf library did not load.',true);
                  else if(!d.androidObjectPresent)show('PDF diagnostic FAILED: AndroidPrint interface was never injected into WebView.',true);
                  else if(!d.androidPingReady)show('PDF diagnostic FAILED: AndroidPrint.ping() did not return the expected response.',true);
                  else show('PDF diagnostic FAILED: Android bridge methods or PDF connection check failed.',true);
                }
              },250);
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
            document.addEventListener('visibilitychange',function(){if(!document.hidden&&state!=='connected')start();});
          })();
          </script>'''
          if '</body>' not in s: raise SystemExit('V25 closing body tag missing')
          s=s.replace('</body>',bridge+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          checks=['src="html2pdf.bundle.min.js"','id="dr-patil-pdf-generator-v2"','PDF diagnostic 1/3: JavaScript loaded','javascriptLoaded:true','DR_PATIL_PDF_BRIDGE_READY_V2','window.AndroidPrint.sharePdf(base64','window.AndroidPrint.print()','id="print"','id="share"','id="printFollowup"','data-print-fu','data-direct-preview','data-preop-preview']
          missing=[x for x in checks if x not in s]
          if missing: raise SystemExit('PDF bridge verification failed: '+', '.join(missing))
          scripts=re.findall(r'<script\b[^>]*>(.*?)</script\s*>',s,re.I|re.S)
          Path('/tmp/drpatil-v25-scripts.js').write_text('\n;\n'.join(x for x in scripts if x.strip()),encoding='utf-8')
          print('All existing V25 digital PDF routes now generate a PDF and open Android share/save options.')
          PY

      - name: Sync final PDF files into Android assets (critical)
        shell: bash
        run: |
          set -euo pipefail
          # Capacitor copied www/ before the PDF bridge was injected. Sync again now,
          # so the APK contains the final HTML and local html2pdf bundle.
          npx cap sync android
          A=android/app/src/main/assets/public/index.html
          test -s "$A"
          grep -q 'id="dr-patil-pdf-generator-v2"' "$A"
          grep -q 'PDF diagnostic 1/3: JavaScript loaded' "$A"
          grep -q 'window.AndroidPrint.sharePdf(base64' "$A"
          test -s android/app/src/main/assets/public/html2pdf.bundle.min.js
          echo 'Verified: final PDF bridge HTML and html2pdf library are copied into Android assets.'

      - name: Verify source preservation and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check /tmp/drpatil-v25-scripts.js
          python3 - <<'PY'
          from pathlib import Path
          original=Path('DrPatil_Digital_OPD_V25_V22PlusBackupOnly.html').read_text(encoding='utf-8')
          built=Path('www/index.html').read_text(encoding='utf-8')
          marker='<script id="dr-patil-pdf-generator-v2">'
          assert built.count(marker)==1,'PDF bridge script count is not one'
          start=built.index(marker);end=built.index('</script>',start)+len('</script>')
          stripped=built[:start]+built[end:]
          stripped=stripped.replace('<script src="html2pdf.bundle.min.js"></script>\n','',1)
          stripped=stripped.replace('\n</body>','</body>',1)
          if stripped!=original: raise SystemExit('V25 source changed beyond the PDF additions')
          assert Path('www/html2pdf.bundle.min.js').is_file()
          print('V25 preservation and JavaScript syntax checks passed.')
          PY

      - name: Verify native PDF bridge configuration
        shell: bash
        run: |
          set -euo pipefail
          J=android/app/src/main/java/com/drpatil/digitalopd/MainActivity.java
          grep -q 'class MainActivity extends BridgeActivity' "$J"
          grep -q 'DR_PATIL_PDF_BRIDGE_READY_V2' "$J"
          grep -q 'void sharePdf(String encoded,String patient)' "$J"
          grep -q 'FileProvider.getUriForFile' "$J"
          grep -q 'androidx.core.content.FileProvider' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/xml/file_paths.xml
          echo 'Native PDF creation/sharing checks passed.'

      - name: Build and integrity-check APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/public/index.html > /tmp/drpatil-apk-index.html
          grep -q 'id="dr-patil-pdf-generator-v2"' /tmp/drpatil-apk-index.html
          grep -q 'PDF diagnostic 1/3: JavaScript loaded' /tmp/drpatil-apk-index.html
          unzip -l "$APK" | grep -q 'assets/public/html2pdf.bundle.min.js'
          echo 'APK created; archive integrity and embedded PDF assets verified.'
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dr-Patil-Digital-OPD-V25-PDF-Creation-Fix
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
